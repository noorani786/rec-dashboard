# Reverse proxy for REC Reporting Dashboard
# Copy to /etc/nginx/sites-available/rec-dashboard and symlink into sites-enabled.
#
# IP-only (no domain yet): keep server_name as your droplet IP.
# With a domain later: change server_name and run certbot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.241.132.102 _;

    # Password gate (create with: sudo htpasswd -c /etc/nginx/.htpasswd-rec rec)
    auth_basic           "REC Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-rec;

    # Do not cache dashboard responses
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
